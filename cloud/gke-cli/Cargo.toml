[package]
name = "gke-setup"
version = "0.6.0"
edition = "2024"

[[bin]]
name = "gke-setup"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cloud-common = { path = "../common" }
dialoguer = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
