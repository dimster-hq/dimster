# GCP Compute Engine machine type specifications for GKE benchmarks.
# Used by gke-setup to suggest heap/CPU/memory defaults, filter compatible disk
# types, pick the right GKE node boot disk, warn on VM storage ceilings, and
# estimate hourly cluster costs before deployment.
# Add new machine types here — no recompilation needed.
#
# Fields:
#   vcpu               - vCPU count
#   memoryGib          - RAM in GiB (note: c4 uses 3.75 GiB/vCPU; c4d uses ~3.875 GiB/vCPU)
#   arch               - x86_64 | arm64
#   hourlyUsd          - baseline us-central1 on-demand USD/hr (includes bundled Local SSDs on -lssd)
#   networkGbps        - standard sustained egress bandwidth in Gbps
#   tier1NetworkGbps   - optional Tier_1 egress bandwidth in Gbps (where supported)
#   bootDiskType       - pd-balanced | hyperdisk-balanced (required by GKE node-pools create)
#   supportedDiskTypes - disk types supported for Kafka data volumes on this machine family:
#                        hyperdisk-balanced, hyperdisk-extreme, hyperdisk-throughput,
#                        pd-ssd, pd-balanced
#   diskBandwidthMiBs  - per-VM max network-attached disk throughput (MiB/s) for primary disk family
#   diskMaxIops        - per-VM max network-attached disk IOPS for primary disk family
#   localSsdMode       - none | fixed | attachable
#   localSsdCount      - fixed count of 375 GiB Local NVMe SSDs (for -lssd shapes)
#   maxLocalSsdCount   - max attachable 375 GiB Local NVMe SSDs via GKE --local-nvme-ssd-block (n2/n2d)

# ---------------------------------------------------------------------------
# Cost-optimized — E2 (good for infra/monitoring nodes; Persistent Disk only)
# ---------------------------------------------------------------------------
e2-standard-2: { vcpu: 2, memoryGib: 8,  arch: x86_64, hourlyUsd: 0.067, networkGbps: 4.0,  bootDiskType: pd-balanced, supportedDiskTypes: [pd-ssd, pd-balanced], diskBandwidthMiBs: 240, diskMaxIops: 15000, localSsdMode: none }
e2-standard-4: { vcpu: 4, memoryGib: 16, arch: x86_64, hourlyUsd: 0.134, networkGbps: 8.0,  bootDiskType: pd-balanced, supportedDiskTypes: [pd-ssd, pd-balanced], diskBandwidthMiBs: 240, diskMaxIops: 15000, localSsdMode: none }
