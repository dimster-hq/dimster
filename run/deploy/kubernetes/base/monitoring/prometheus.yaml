# Identity for Prometheus. Unused unless monitoring.cgroupMetrics is set,
# in which case the CLI binds it to a ClusterRole for scraping the kubelets'
# cAdvisor (cli/src/commands/cadvisor.rs).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: dimster
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: dimster
  labels:
    app: prometheus
spec:
  replicas: 1
  # Recreate avoids stuck rollouts where new pods can't schedule
  # while old pods refuse to terminate (default RollingUpdate with maxUnavailable: 0)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      # Prometheus runs as user 'nobody' (65534). The fsGroup ensures
      # the PVC is writable by that user.
      securityContext:
        fsGroup: 65534
        runAsUser: 65534
        runAsNonRoot: true
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.retention.time=7d"
            - "--storage.tsdb.path=/prometheus"
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "100m"
              memory: "1Gi"
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: dimster
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: dimster
  labels:
    app: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
