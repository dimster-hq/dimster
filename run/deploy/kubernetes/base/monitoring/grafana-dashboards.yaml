apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: dimster
data:
  clients.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "title": "Publish Latency (ms)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "pointSize": 5, "showPoints": "never" }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "avg(client_publish_latency{percentile=\"50\"})", "legendFormat": "p50" },
            { "expr": "avg(client_publish_latency{percentile=\"99\"})", "legendFormat": "p99" },
            { "expr": "avg(client_publish_latency{percentile=\"99.9\"})", "legendFormat": "p99.9" },
            { "expr": "max(client_publish_latency{percentile=\"100\"})", "legendFormat": "max" }
          ]
        },
        {
          "title": "End-to-End Latency (ms)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "pointSize": 5, "showPoints": "never" }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "avg(client_e2e_latency{percentile=\"50\"})", "legendFormat": "p50" },
            { "expr": "avg(client_e2e_latency{percentile=\"99\"})", "legendFormat": "p99" },
            { "expr": "avg(client_e2e_latency{percentile=\"99.9\"})", "legendFormat": "p99.9" },
            { "expr": "max(client_e2e_latency{percentile=\"100\"})", "legendFormat": "max" }
          ]
        },
        {
          "title": "Publish Delay (ms)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "pointSize": 5, "showPoints": "never" }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "avg(client_publish_delay_latency{percentile=\"50\"})", "legendFormat": "p50" },
            { "expr": "avg(client_publish_delay_latency{percentile=\"99\"})", "legendFormat": "p99" },
            { "expr": "avg(client_publish_delay_latency{percentile=\"99.9\"})", "legendFormat": "p99.9" },
            { "expr": "max(client_publish_delay_latency{percentile=\"100\"})", "legendFormat": "max" }
          ]
        },
        {
          "title": "E2E Delivery Latency (ms)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "pointSize": 5, "showPoints": "never" }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "avg(client_e2e_delivery_latency{percentile=\"50\"})", "legendFormat": "p50" },
            { "expr": "avg(client_e2e_delivery_latency{percentile=\"99\"})", "legendFormat": "p99" },
            { "expr": "avg(client_e2e_delivery_latency{percentile=\"99.9\"})", "legendFormat": "p99.9" },
            { "expr": "max(client_e2e_delivery_latency{percentile=\"100\"})", "legendFormat": "max" }
          ]
        },
        {
          "title": "Schedule Latency (ms)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "pointSize": 5, "showPoints": "never" }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "avg(client_schedule_latency{percentile=\"50\"})", "legendFormat": "p50" },
            { "expr": "avg(client_schedule_latency{percentile=\"99\"})", "legendFormat": "p99" },
            { "expr": "avg(client_schedule_latency{percentile=\"99.9\"})", "legendFormat": "p99.9" },
            { "expr": "max(client_schedule_latency{percentile=\"100\"})", "legendFormat": "max" }
          ]
        },
        {
          "title": "Messages Sent (rate/s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 24 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "pointSize": 5, "showPoints": "never" }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "sum(rate(client_messages_sent_count[1m]))", "legendFormat": "total msg/s" },
            { "expr": "rate(client_messages_sent_count[1m])", "legendFormat": "{{host}}" }
          ]
        },
        {
          "title": "Messages Received (rate/s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 24 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "pointSize": 5, "showPoints": "never" }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "sum(rate(client_messages_received_count[1m]))", "legendFormat": "total msg/s" },
            { "expr": "rate(client_messages_received_count[1m])", "legendFormat": "{{host}}" }
          ]
        },
        {
          "title": "Bytes Sent (rate/s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 32 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "pointSize": 5, "showPoints": "never" }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "sum(rate(client_bytes_sent_count[1m]))", "legendFormat": "total" },
            { "expr": "rate(client_bytes_sent_count[1m])", "legendFormat": "{{host}}" }
          ]
        },
        {
          "title": "Errors",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 32 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "pointSize": 5, "showPoints": "never" }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "sum(rate(client_producer_errors_count[1m]))", "legendFormat": "producer errors" },
            { "expr": "sum(rate(client_producer_timeout_errors_count[1m]))", "legendFormat": "timeout errors" },
            { "expr": "sum(rate(client_consumer_errors_count[1m]))", "legendFormat": "consumer errors" }
          ]
        },
        {
          "title": "Total Messages (cumulative)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 40 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "pointSize": 5, "showPoints": "never" }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "sum(client_messages_sent_count)", "legendFormat": "sent" },
            { "expr": "sum(client_messages_received_count)", "legendFormat": "received" }
          ]
        },
        {
          "title": "Client Counts",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 40 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "pointSize": 5, "showPoints": "never" },
              "decimals": 0
            },
            "overrides": []
          },
          "targets": [
            { "expr": "sum(client_producer_count)", "legendFormat": "producers" },
            { "expr": "sum(client_consumer_count)", "legendFormat": "consumers" }
          ]
        },
        {
          "title": "Publish Latency by Worker (p99, ms)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 48 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "pointSize": 5, "showPoints": "never" }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "client_publish_latency{percentile=\"99\"}", "legendFormat": "{{host}}" }
          ]
        },
        {
          "title": "E2E Latency by Worker (p99, ms)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 48 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "pointSize": 5, "showPoints": "never" }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "client_e2e_latency{percentile=\"99\"}", "legendFormat": "{{host}}" }
          ]
        },

        {
          "title": "Consumer Details",
          "type": "row",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 56 },
          "collapsed": false
        },
        {
          "title": "Poll Batch Size (records)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 57 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "pointSize": 5, "showPoints": "never" }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "avg(client_poll_batch_size{percentile=\"50\"})", "legendFormat": "p50" },
            { "expr": "avg(client_poll_batch_size{percentile=\"75\"})", "legendFormat": "p75" },
            { "expr": "avg(client_poll_batch_size{percentile=\"99\"})", "legendFormat": "p99" },
            { "expr": "max(client_poll_batch_size{percentile=\"100\"})", "legendFormat": "max" }
          ]
        },
        {
          "title": "Poll Rate (/s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 57 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "pointSize": 5, "showPoints": "never" }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "sum(rate(client_consumer_polls_count[1m]))", "legendFormat": "total polls/s" },
            { "expr": "rate(client_consumer_polls_count[1m])", "legendFormat": "{{host}}" }
          ]
        },
        {
          "title": "Commit Sync Latency (ms)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 65 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "pointSize": 5, "showPoints": "never" }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "avg(client_commit_sync_latency{percentile=\"50\"})", "legendFormat": "p50" },
            { "expr": "avg(client_commit_sync_latency{percentile=\"75\"})", "legendFormat": "p75" },
            { "expr": "avg(client_commit_sync_latency{percentile=\"99\"})", "legendFormat": "p99" },
            { "expr": "avg(client_commit_sync_latency{percentile=\"99.9\"})", "legendFormat": "p99.9" },
            { "expr": "max(client_commit_sync_latency{percentile=\"100\"})", "legendFormat": "max" }
          ]
        },
        {
          "title": "Commit Rate (/s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 65 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "pointSize": 5, "showPoints": "never" }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "sum(rate(client_consumer_commit_sync_count[1m]))", "legendFormat": "sync" },
            { "expr": "sum(rate(client_consumer_commit_async_count[1m]))", "legendFormat": "async" }
          ]
        },
        {
          "title": "Processing Time (ms)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 73 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "pointSize": 5, "showPoints": "never" }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "avg(client_processing_time{percentile=\"50\"})", "legendFormat": "p50" },
            { "expr": "avg(client_processing_time{percentile=\"75\"})", "legendFormat": "p75" },
            { "expr": "avg(client_processing_time{percentile=\"99\"})", "legendFormat": "p99" },
            { "expr": "avg(client_processing_time{percentile=\"99.9\"})", "legendFormat": "p99.9" },
            { "expr": "max(client_processing_time{percentile=\"100\"})", "legendFormat": "max" }
          ]
        },
        {
          "title": "Consumer Recreations (cumulative)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 73 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "pointSize": 5, "showPoints": "never" },
              "decimals": 0
            },
            "overrides": []
          },
          "targets": [
            { "expr": "sum(client_consumer_recreations_count)", "legendFormat": "recreations" }
          ]
        },

        {
          "title": "Per-Partition Details",
          "type": "row",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 81 },
          "collapsed": false
        },
        {
          "title": "Messages Received by Partition (rate/s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 82 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "pointSize": 5, "showPoints": "never" }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "sum by (partition) (rate(client_pp_messages_received_count[1m]))", "legendFormat": "{{partition}}" }
          ]
        },
        {
          "title": "Messages Sent by Partition (rate/s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 90 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "pointSize": 5, "showPoints": "never" }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "sum by (partition) (rate(client_pp_messages_sent_count[1m]))", "legendFormat": "{{partition}}" }
          ]
        },
        {
          "title": "E2E Latency by Partition (p99, ms)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 98 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "pointSize": 5, "showPoints": "never" }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "sum by (partition) (client_pp_e2e_latency{percentile=\"99\"})", "legendFormat": "{{partition}}" }
          ]
        },
        {
          "title": "Publish Latency by Partition (p99, ms)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 98 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "pointSize": 5, "showPoints": "never" }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "sum by (partition) (client_pp_publish_latency{percentile=\"99\"})", "legendFormat": "{{partition}}" }
          ]
        },
        {
          "title": "Total Messages Sent by Partition (cumulative)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 106 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "pointSize": 5, "showPoints": "never" }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "sum by (partition) (client_pp_messages_sent_count)", "legendFormat": "{{partition}}" }
          ]
        },
        {
          "title": "Total Messages Received by Partition (cumulative)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 106 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "pointSize": 5, "showPoints": "never" }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "sum by (partition) (client_pp_messages_received_count)", "legendFormat": "{{partition}}" }
          ]
        },

        {
          "title": "Per-Consumer Details",
          "type": "row",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 114 },
          "collapsed": false
        },
        {
          "title": "Messages Received by Consumer (rate/s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 115 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "pointSize": 5, "showPoints": "never" }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "sum by (consumer) (rate(client_pc_messages_received_count[1m]))", "legendFormat": "{{consumer}}" }
          ]
        },

        {
          "title": "Share Group Lag",
          "type": "row",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 123 },
          "collapsed": false
        },
        {
          "title": "Share Group Lag (total by group)",
          "description": "Total lag across all partitions per share group, as reported by the broker",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 124 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "showPoints": "never", "spanNulls": true }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "max by (group) (client_share_group_lag_total{})", "legendFormat": "{{group}}" }
          ]
        },
        {
          "title": "Share Group Lag (by partition)",
          "description": "Per-partition share group lag",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 124 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "showPoints": "never", "spanNulls": true }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "max by (topic, partition) (client_share_group_lag{})", "legendFormat": "{{topic}}-{{partition}}" }
          ]
        },

        {
          "title": "Kafka Producer Client Metrics",
          "type": "row",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 132 },
          "collapsed": false
        },
        {
          "title": "Record Queue Time (ms)",
          "description": "Time records spend in the producer accumulator before being sent — reveals backpressure",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 133 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "pointSize": 5, "showPoints": "never", "spanNulls": true }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "avg(kafka_producer_metrics_record_queue_time_avg)", "legendFormat": "avg" },
            { "expr": "max(kafka_producer_metrics_record_queue_time_max)", "legendFormat": "max" }
          ]
        },
        {
          "title": "Request Latency (ms)",
          "description": "Round-trip time of produce requests to the broker",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 133 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
