apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: benchmark-results
  namespace: dimster
  labels:
    app: benchmark-results
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # 4Gi satisfies GCP Hyperdisk Balanced's 4 GB minimum volume size (for Gen-4 C4/N4/C4A nodes).
      storage: 4Gi
